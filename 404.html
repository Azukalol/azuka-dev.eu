<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>404 — azuka.</title>
<meta name="robots" content="noindex" />
<style>
  :root{--paper:#f3efe6;--ink:#0b0b0b;--f:'VCR','Helv',monospace}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--f);
    display:grid;place-items:center;overflow:hidden;
    padding:clamp(1rem,4vw,3rem);
  }
  .psp{
    width:min(680px,100%);aspect-ratio:680/520;position:relative;
    border:1px solid var(--ink);padding:2.2rem 2.2rem 2.8rem;
    display:grid;place-content:center;text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,.18);
  }
  .psp::before,.psp::after{
    content:'';position:absolute;left:0;right:0;height:7px;
    background:repeating-linear-gradient(90deg,var(--ink) 0 10px,transparent 10px 22px);
  }
  .psp::before{top:10px}
  .psp::after{bottom:10px}
  .err{font-size:clamp(2.6rem,9vw,5rem);letter-spacing:.12em;animation:blink 1.1s steps(1) infinite}
  .msg{margin-top:1.4rem;font-size:clamp(.72rem,2.4vw,.9rem);letter-spacing:.28em;text-transform:uppercase;line-height:2;opacity:.72}
  .key{margin-top:2rem;display:inline-block;font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;border:1px solid var(--ink);padding:.6em 1.3em;color:var(--ink);text-decoration:none;transition:background .2s,color .2s}
  .key:hover{background:var(--ink);color:var(--paper)}
  @keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
  <div class="psp">
    <div class="err">404</div>
    <div class="msg">UMD DISC NOT FOUND<br>AZUKA.DEV.EU HAS NO FILE HERE</div>
    <a class="key" href="/">&#9656; go home</a>
  </div>
</body>
</html>
